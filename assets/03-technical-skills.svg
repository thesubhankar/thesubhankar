        <text x="14" y="22" class="font-sans" font-size="11.5" font-weight="700" fill="#ff007f">🛠️ Tools</text>
        <g transform="translate(14, 34)">
          <rect width="90" height="20" rx="10" fill="#217346"/><text x="59" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Microsoft Excel</text>
          <rect x="96" width="95" height="20" rx="10" fill="#F37626"/><text x="143.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Jupyter Notebook</text>
          <rect x="197" width="65" height="20" rx="10" fill="#43B02A"/><text x="229.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Anaconda</text>
          <rect x="268" width="55" height="20" rx="10" fill="#007ACC"/><text x="295.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">VS Code</text>
        </g>
