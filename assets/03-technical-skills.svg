<svg width="100%" height="auto" viewBox="0 0 850 360" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#247bff"/><stop offset="100%" stop-color="#00f0ff"/></linearGradient>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#070b16"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>
  <style>
    .font-mono { font-family: 'Courier New', Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect x="2" y="2" width="846" height="356" rx="16" fill="url(#gBg)" stroke="url(#gB)" stroke-width="2"/>
  <g transform="translate(35, 22)">
    <text class="font-mono" font-size="12" font-weight="bold" fill="#00f0ff" letter-spacing="1.5" x="0" y="14">💻 TECHNICAL SKILLS &amp; TOOLKIT</text>
    
    <g transform="translate(0, 32)">
      <!-- ROW 1 -->
      <!-- Card 1: Programming -->
      <g transform="translate(0, 0)">
        <rect width="380" height="64" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#247bff" stroke-width="1.5"/>
        <text x="14" y="22" class="font-sans" font-size="11.5" font-weight="700" fill="#00f0ff">🐍 Programming</text>
        <g transform="translate(14, 34)">
          <rect width="60" height="20" rx="10" fill="#3776AB"/><text x="30" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Python</text>
        </g>
      </g>
      <!-- Card 2: Data Analysis -->
      <g transform="translate(400, 0)">
