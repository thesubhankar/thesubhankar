          <rect x="66" width="55" height="20" rx="10" fill="#013243"/><text x="93.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">NumPy</text>
          <rect x="127" width="165" height="20" rx="10" fill="#334155" stroke="#ff007f"/><text x="209.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Exploratory Data Analysis (EDA)</text>
