          <rect x="81" width="50" height="20" rx="10" fill="#D00000"/><text x="106" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Keras</text>
          <rect x="137" width="85" height="20" rx="10" fill="#334155" stroke="#9d4edd"/><text x="179.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">Neural Networks</text>
