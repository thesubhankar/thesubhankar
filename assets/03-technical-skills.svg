          <rect x="51" width="55" height="20" rx="10" fill="#00758F"/><text x="78.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">MySQL</text>
          <rect x="112" width="55" height="20" rx="10" fill="#003B57"/><text x="139.5" y="13.5" class="font-sans" font-size="9.5" font-weight="bold" fill="#fff" text-anchor="middle">SQLite</text>
