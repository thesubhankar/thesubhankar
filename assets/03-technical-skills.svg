          <rect x="75" width="55" height="24" rx="12" fill="#CC2927"/><text x="102" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">💾 SQL</text>
          <rect x="140" width="90" height="24" rx="12" fill="#336791"/><text x="185" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🐘 PostgreSQL</text>
          <rect x="240" width="65" height="24" rx="12" fill="#003B57"/><text x="272" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🗄️ SQLite</text>
          <rect x="315" width="65" height="24" rx="12" fill="#E34F26"/><text x="347" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🌐 HTML5</text>
          <rect x="390" width="55" height="24" rx="12" fill="#1572B6"/><text x="417" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🎨 CSS3</text>
