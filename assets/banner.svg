<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%" style="border-radius: 12px; overflow: hidden; background: #030712;">
  <defs>
    <!-- Font Import -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Fira+Code:wght@400;600&amp;display=swap');
      
      .main-title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 600;
        fill: #cbd5e1;
        letter-spacing: 0.05em;
      }

      .code-watermark {
        font-family: 'Fira Code', monospace;
        font-weight: 500;
      }

      .star {
        animation: twinkle 4s infinite ease-in-out;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }

      .neural-synapse {
        animation: synapse 4s infinite ease-in-out;
      }
      @keyframes synapse {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 20; }
        50% { opacity: 0.8; stroke-dashoffset: 0; }
      }
    </style>

    <!-- Glow Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0b0f19" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="city-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" fill="url(#bg-grad)" />

  <!-- Perspective Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="430" x2="1200" y2="430" />

    <line x1="600" y1="225" x2="-200" y2="450" />
    <line x1="600" y1="225" x2="0" y2="450" />
    <line x1="600" y1="225" x2="200" y2="450" />
    <line x1="600" y1="225" x2="400" y2="450" />
    <line x1="600" y1="225" x2="600" y2="450" />
    <line x1="600" y1="225" x2="800" y2="450" />
    <line x1="600" y1="225" x2="1000" y2="450" />
    <line x1="600" y1="225" x2="1200" y2="450" />
    <line x1="600" y1="225" x2="1400" y2="450" />

    <line x1="600" y1="225" x2="-200" y2="0" />
    <line x1="600" y1="225" x2="200" y2="0" />
    <line x1="600" y1="225" x2="600" y2="0" />
    <line x1="600" y1="225" x2="1000" y2="0" />
    <line x1="600" y1="225" x2="1400" y2="0" />
  </g>

  <!-- Data Science & AI/ML Watermarks (Background Equations & Code) -->
  <g class="code-watermark">
    <text x="80" y="70" font-size="14" fill="#a855f7" opacity="0.45">y = f(W^T · X + b)</text>
    <text x="260" y="55" font-size="13" fill="#06b6d4" opacity="0.35">Loss = 0.0014 | Acc = 99.8%</text>
    <text x="920" y="75" font-size="14" fill="#06b6d4" opacity="0.45">&lt;Deep Learning / Neural Net&gt;</text>
    <text x="960" y="340" font-size="13" fill="#38bdf8" opacity="0.4">Epochs: 100/100 [==============]</text>
    <text x="70" y="360" font-size="13" fill="#c084fc" opacity="0.4">tf.keras.Sequential([Dense(128)])</text>
  </g>

  <!-- Neural Network Nodes Graph (Left Background) -->
  <g stroke-width="1.2" opacity="0.65">
    <!-- Synapse Connections -->
    <line x1="60" y1="180" x2="150" y2="140" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="180" x2="150" y2="200" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="240" x2="150" y2="200" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="240" x2="150" y2="260" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="300" x2="150" y2="260" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="300" x2="150" y2="320" stroke="#a855f7" class="neural-synapse" />

    <line x1="150" y1="140" x2="240" y2="170" stroke="#06b6d4" class="neural-synapse" />
    <line x1="150" y1="200" x2="240" y2="170" stroke="#06b6d4" class="neural-synapse" />
    <line x1="150" y1="200" x2="240" y2="270" stroke="#06b6d4" class="neural-synapse" />
    <line x1="150" y1="260" x2="240" y2="270" stroke="#06b6d4" class="neural-synapse" />
    <line x1="150" y1="320" x2="240" y2="270" stroke="#06b6d4" class="neural-synapse" />

    <!-- Input Layer Nodes -->
    <circle cx="60" cy="180" r="5" fill="#a855f7" filter="url(#purple-glow)" />
    <circle cx="60" cy="240" r="5" fill="#a855f7" filter="url(#purple-glow)" />
    <circle cx="60" cy="300" r="5" fill="#a855f7" filter="url(#purple-glow)" />

    <!-- Hidden Layer Nodes -->
    <circle cx="150" cy="140" r="6" fill="#c084fc" />
    <circle cx="150" cy="200" r="6" fill="#06b6d4" />
    <circle cx="150" cy="260" r="6" fill="#c084fc" />
    <circle cx="150" cy="320" r="6" fill="#06b6d4" />

    <!-- Output Layer Nodes -->
    <circle cx="240" cy="170" r="7" fill="#00f0ff" filter="url(#cyan-glow)" />
    <circle cx="240" cy="270" r="7" fill="#00f0ff" filter="url(#cyan-glow)" />
  </g>

  <!-- ML Predictive Analytics Optimization Curve & Area Chart (Right Background) -->
  <g opacity="0.6">
    <!-- Area Fill -->
    <path d="M 940,360 Q 1000,220 1060,290 T 1170,170 L 1170,360 Z" fill="url(#chart-grad)" />
    <!-- Gradient Line -->
    <path d="M 940,360 Q 1000,220 1060,290 T 1170,170" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#cyan-glow)" />
    
    <!-- Data Points on Curve -->
    <circle cx="1000" cy="255" r="4" fill="#ffffff" />
    <circle cx="1060" cy="290" r="4" fill="#00f0ff" />
    <circle cx="1115" cy="225" r="4" fill="#a855f7" />
    <circle cx="1170" cy="170" r="5" fill="#ffffff" filter="url(#cyan-glow)" />
  </g>

  <!-- Data Analytics Column Bar Chart (Bottom Right) -->
  <g opacity="0.5" fill="#06b6d4">
    <rect x="850" y="320" width="12" height="40" rx="2" />
    <rect x="868" y="300" width="12" height="60" rx="2" fill="#38bdf8" />
    <rect x="886" y="280" width="12" height="80" rx="2" fill="#818cf8" />
    <rect x="904" y="255" width="12" height="105" rx="2" fill="#a855f7" filter="url(#purple-glow)" />
  </g>

  <!-- Twinkling Stars -->
  <g fill="#ffffff">
    <circle class="star" cx="120" cy="60" r="1" opacity="0.6" />
    <circle class="star" cx="280" cy="90" r="1.5" opacity="0.8" />
    <circle class="star" cx="450" cy="40" r="1.2" opacity="0.5" />
    <circle class="star" cx="750" cy="70" r="1.5" opacity="0.7" />
    <circle class="star" cx="980" cy="50" r="1" opacity="0.9" />
    <circle class="star" cx="1100" cy="110" r="1.2" opacity="0.6" />
  </g>

  <!-- Cyberpunk City Skyline (Right Side Horizon) -->
  <g fill="url(#city-grad)" stroke="#312e81" stroke-width="0.5" opacity="0.7">
    <rect x="820" y="175" width="20" height="50" />
    <rect x="844" y="155" width="26" height="70" />
    <rect x="874" y="180" width="16" height="45" />
    <rect x="894" y="140" width="30" height="85" />
    <polygon points="936,130 939,105 942,130" />
    <rect x="928" y="130" width="18" height="95" />
    <rect x="950" y="165" width="24" height="60" />
    <rect x="978" y="145" width="28" height="80" />
  </g>

  <!-- Glowing Horizon Line -->
  <line x1="0" y1="225" x2="600" y2="225" stroke="#c084fc" stroke-width="3" filter="url(#purple-glow)" />
  <line x1="0" y1="225" x2="600" y2="225" stroke="#ffffff" stroke-width="1" />

  <line x1="600" y1="225" x2="1200" y2="225" stroke="#22d3ee" stroke-width="3" filter="url(#cyan-glow)" />
  <line x1="600" y1="225" x2="1200" y2="225" stroke="#ffffff" stroke-width="1" />

  <!-- Center Framing Box (Futuristic Sci-Fi HUD Container) -->
  <g>
    <!-- Background Glass Tint -->
    <rect x="300" y="145" width="600" height="155" rx="16" fill="#090d16" fill-opacity="0.8" stroke="url(#frame-grad)" stroke-width="2" filter="url(#cyan-glow)" />

    <!-- Corner Accents -->
    <path d="M 290,165 L 290,135 L 320,135" stroke="#a855f7" stroke-width="3" fill="none" />
    <path d="M 910,165 L 910,135 L 880,135" stroke="#06b6d4" stroke-width="3" fill="none" />
    <path d="M 290,280 L 290,310 L 320,310" stroke="#a855f7" stroke-width="3" fill="none" />
    <path d="M 910,280 L 910,310 L 880,310" stroke="#06b6d4" stroke-width="3" fill="none" />
  </g>

  <!-- Center Text Content -->
  <text x="600" y="210" text-anchor="middle" class="main-title" filter="url(#cyan-glow)" opacity="0.6">Subhankar Giri</text>
  <text x="600" y="210" text-anchor="middle" class="main-title">Subhankar Giri</text>

  <!-- Subtitle -->
  <text x="600" y="260" text-anchor="middle" class="subtitle">Data Science &amp; AI/ML Engineer</text>
</svg>
