<svg width="100%" height="auto" viewBox="0 0 850 430" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stackBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'Courier New', Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes rotateOrbit1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotateOrbit2 { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes rotateOrbit3 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .orbit-group-1 { transform-origin: 425px 115px; animation: rotateOrbit1 22s infinite linear; }
    .orbit-group-2 { transform-origin: 425px 115px; animation: rotateOrbit2 16s infinite linear; }
    .orbit-group-3 { transform-origin: 425px 115px; animation: rotateOrbit3 28s infinite linear; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="426" rx="16" fill="url(#bgGrad)" stroke="url(#stackBorder)" stroke-width="2" />

  <!-- Title -->
  <text x="425" y="35" class="font-mono" font-size="12" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">⚡ THE ORBITAL TECH SYSTEM &amp; OFFICIAL BRAND LOGOS</text>

  <!-- TOP SECTION: Elliptical Orbits with Official Brand Vector Logos -->
  <!-- Center Core -->
  <circle cx="425" cy="115" r="30" fill="#247bff" fill-opacity="0.25" stroke="#00f0ff" stroke-width="2" />
  <text x="425" y="120" class="font-sans" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AI / ML</text>

  <!-- Orbit 1 (Large 300x60) -->
  <ellipse cx="425" cy="115" rx="300" ry="60" fill="none" stroke="#247bff" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6" />
  <g class="orbit-group-1">
    <!-- Python Official Logo -->
    <g transform="translate(125, 115)">
      <circle r="20" fill="#0f172a" stroke="#3776AB" stroke-width="2" />
      <path d="M -8 -8 L 0 -12 L 8 -8 L 8 0 L 0 4 L -8 0 Z" fill="#3776AB" />
      <path d="M -8 0 L 0 -4 L 8 0 L 8 8 L 0 12 L -8 8 Z" fill="#FFD43B" />
      <circle cx="-3" cy="-7" r="1.5" fill="#ffffff" />
      <circle cx="3" cy="7" r="1.5" fill="#3776AB" />
    </g>

    <!-- TensorFlow Official Logo -->
    <g transform="translate(725, 115)">
      <circle r="20" fill="#0f172a" stroke="#FF6F00" stroke-width="2" />
      <path d="M -10 -10 L 0 -15 L 10 -10 L 10 5 L 0 10 L 0 -5 L -10 -10 Z" fill="#FF6F00" />
      <path d="M 0 -5 L 10 0 L 10 10 L 0 5 Z" fill="#FFA800" />
    </g>
  </g>

  <!-- Orbit 2 (Medium 200x45) -->
  <ellipse cx="425" cy="115" rx="200" ry="45" fill="none" stroke="#ff354f" stroke-opacity="0.3" stroke-width="1.5" />
  <g class="orbit-group-2">
    <!-- PyTorch Official Logo Flame -->
    <g transform="translate(225, 115)">
      <circle r="18" fill="#0f172a" stroke="#EE4C2C" stroke-width="2" />
      <path d="M 0 -10 Q 8 -2 4 8 Q -4 12 -8 4 Q -8 -4 0 -10 Z" fill="#EE4C2C" />
      <circle cx="5" cy="-5" r="2" fill="#FFA800" />
    </g>

    <!-- Streamlit Official Crown Logo -->
    <g transform="translate(625, 115)">
      <circle r="18" fill="#0f172a" stroke="#FF4B4B" stroke-width="2" />
      <path d="M -10 6 L -10 -4 L -3 2 L 0 -6 L 3 2 L 10 -4 L 10 6 Z" fill="#FF4B4B" />
    </g>
  </g>

  <!-- Orbit 3 (Inner 110x30) -->
  <ellipse cx="425" cy="115" rx="110" ry="30" fill="none" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4" />
  <g class="orbit-group-3">
    <!-- Pandas Official Logo -->
    <g transform="translate(315, 115)">
      <circle r="16" fill="#0f172a" stroke="#150458" stroke-width="2" />
      <rect x="-8" y="-10" width="4" height="20" fill="#150458" rx="2" />
      <rect x="-2" y="-10" width="4" height="20" fill="#E70488" rx="2" />
      <rect x="4" y="-10" width="4" height="20" fill="#150458" rx="2" />
    </g>

    <!-- Power BI Official Logo -->
    <g transform="translate(535, 115)">
      <circle r="16" fill="#0f172a" stroke="#F2C811" stroke-width="2" />
      <rect x="-8" y="-2" width="4" height="10" fill="#F2C811" rx="1" />
      <rect x="-2" y="-6" width="4" height="14" fill="#F2C811" rx="1" />
      <rect x="4" y="-10" width="4" height="18" fill="#F2C811" rx="1" />
    </g>
  </g>

  <!-- BOTTOM SECTION: Stack Clusters Chips -->
  <g transform="translate(35, 205)">
    <!-- Row 1: Languages & DBs -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="780" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="15" y="26" class="font-sans" font-size="12" font-weight="700" fill="#00f0ff">⚡ Languages &amp; DBs:</text>
      
      <g transform="translate(150, 9)">
        <rect width="65" height="24" rx="12" fill="#3776AB" />
        <text x="32" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🐍 Python</text>

        <rect x="75" width="55" height="24" rx="12" fill="#CC2927" />
        <text x="102" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">💾 SQL</text>

        <rect x="140" width="90" height="24" rx="12" fill="#336791" />
        <text x="185" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🐘 PostgreSQL</text>

        <rect x="240" width="65" height="24" rx="12" fill="#003B57" />
        <text x="272" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🗄️ SQLite</text>

        <rect x="315" width="65" height="24" rx="12" fill="#E34F26" />
        <text x="347" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🌐 HTML5</text>

        <rect x="390" width="55" height="24" rx="12" fill="#1572B6" />
        <text x="417" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🎨 CSS3</text>

        <rect x="455" width="85" height="24" rx="12" fill="#F7DF1E" />
        <text x="497" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">⚡ JavaScript</text>
      </g>
    </g>

    <!-- Row 2: Data Science & AI/ML -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="780" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="15" y="26" class="font-sans" font-size="12" font-weight="700" fill="#ff007f">🤖 Data Science &amp; AI:</text>
      
      <g transform="translate(150, 9)">
        <rect width="65" height="24" rx="12" fill="#150458" />
        <text x="32" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🐼 Pandas</text>

        <rect x="75" width="65" height="24" rx="12" fill="#013243" />
        <text x="107" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🔢 NumPy</text>

        <rect x="150" width="90" height="24" rx="12" fill="#F15A24" />
        <text x="195" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">📊 Scikit-Learn</text>

        <rect x="250" width="85" height="24" rx="12" fill="#FF6F00" />
        <text x="292" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🟧 TensorFlow</text>

        <rect x="345" width="70" height="24" rx="12" fill="#EE4C2C" />
        <text x="380" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🔥 PyTorch</text>

        <rect x="425" width="70" height="24" rx="12" fill="#FF8A00" />
        <text x="460" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">⚡ XGBoost</text>

        <rect x="505" width="75" height="24" rx="12" fill="#FF4B4B" />
        <text x="542" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">👑 Streamlit</text>
      </g>
    </g>

    <!-- Row 3: BI & Visualization -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="780" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="15" y="26" class="font-sans" font-size="12" font-weight="700" fill="#39ff14">📊 Analytics &amp; BI:</text>
      
      <g transform="translate(150, 9)">
        <rect width="80" height="24" rx="12" fill="#F2C811" />
        <text x="40" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">📈 Power BI</text>

        <rect x="90" width="70" height="24" rx="12" fill="#E97627" />
        <text x="125" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">📊 Tableau</text>

        <rect x="170" width="90" height="24" rx="12" fill="#217346" />
        <text x="215" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">📑 MS Excel</text>

        <rect x="270" width="60" height="24" rx="12" fill="#3F4F75" />
        <text x="300" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">📈 Plotly</text>

        <rect x="340" width="70" height="24" rx="12" fill="#4C72B0" />
        <text x="375" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🌊 Seaborn</text>
      </g>
    </g>

    <!-- Row 4: Tools & DevOps -->
    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="780" height="42" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="15" y="26" class="font-sans" font-size="12" font-weight="700" fill="#9d4edd">🛠️ Tools &amp; DevOps:</text>
      
      <g transform="translate(150, 9)">
        <rect width="55" height="24" rx="12" fill="#F05032" />
        <text x="27" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🔀 Git</text>

        <rect x="65" width="70" height="24" rx="12" fill="#181717" stroke="#334155" />
        <text x="100" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🐙 GitHub</text>

        <rect x="145" width="70" height="24" rx="12" fill="#2496ED" />
        <text x="180" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🐳 Docker</text>

        <rect x="225" width="75" height="24" rx="12" fill="#007ACC" />
        <text x="262" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">💙 VS Code</text>

        <rect x="310" width="115" height="24" rx="12" fill="#F37626" />
        <text x="367" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">🪐 Jupyter</text>

        <rect x="435" width="95" height="24" rx="12" fill="#F9AB00" />
        <text x="482" y="16" class="font-sans" font-size="11" font-weight="bold" fill="#000" text-anchor="middle">☁️ Colab</text>
      </g>
    </g>
  </g>
</svg>