<svg width="100%" height="auto" viewBox="0 0 850 380" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'Courier New', Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes bar1 { 0% { width: 0%; } 33% { width: 100%; } 100% { width: 100%; } }
    @keyframes bar2 { 0%, 33% { width: 0%; } 66% { width: 100%; } 100% { width: 100%; } }
    @keyframes bar3 { 0%, 66% { width: 0%; } 100% { width: 100%; } }

    .p-bar-1 { animation: bar1 12s infinite linear; }
    .p-bar-2 { animation: bar2 12s infinite linear; }
    .p-bar-3 { animation: bar3 12s infinite linear; }

    @keyframes slide1 { 0%, 31% { opacity: 1; transform: translateX(0); } 34%, 97% { opacity: 0; transform: translateX(20px); } }
    @keyframes slide2 { 0%, 31% { opacity: 0; transform: translateX(-20px); } 34%, 64% { opacity: 1; transform: translateX(0); } 67%, 100% { opacity: 0; transform: translateX(20px); } }
    @keyframes slide3 { 0%, 64% { opacity: 0; transform: translateX(-20px); } 67%, 97% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }

    .slide-1 { animation: slide1 12s infinite; }
    .slide-2 { animation: slide2 12s infinite; }
    .slide-3 { animation: slide3 12s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="376" rx="16" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="2" />

  <!-- LEFT COLUMN: Core Capabilities -->
  <g transform="translate(35, 35)">
    <text class="font-mono" font-size="12" font-weight="bold" fill="#00f0ff" letter-spacing="1.5">⚡ CORE CAPABILITIES &amp; SPECIALIZATIONS</text>
    <text class="font-sans" font-size="22" font-weight="800" fill="#ffffff" y="30">Engineering Data &amp; AI Systems</text>

    <g transform="translate(0, 55)">
      <!-- Capability 1 -->
      <rect x="0" y="0" width="370" height="60" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
      <circle cx="30" cy="30" r="16" fill="#247bff" fill-opacity="0.2" />
      <text x="30" y="35" class="font-sans" font-size="14" text-anchor="middle" fill="#00f0ff">🤖</text>
      <text x="58" y="25" class="font-sans" font-size="14" font-weight="700" fill="#f0f4fc">End-to-End Predictive ML Pipelines</text>
      <text x="58" y="44" class="font-sans" font-size="12" fill="#94a3b8">Regression, Churn Risk AI, Sales Forecasting</text>

      <!-- Capability 2 -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="370" height="60" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="30" r="16" fill="#ff007f" fill-opacity="0.2" />
        <text x="30" y="35" class="font-sans" font-size="14" text-anchor="middle" fill="#ff007f">📊</text>
        <text x="58" y="25" class="font-sans" font-size="14" font-weight="700" fill="#f0f4fc">Interactive BI &amp; Decision Dashboards</text>
        <text x="58" y="44" class="font-sans" font-size="12" fill="#94a3b8">Streamlit Cloud, Power BI Desktop, Plotly</text>
      </g>

      <!-- Capability 3 -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="370" height="60" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="30" r="16" fill="#39ff14" fill-opacity="0.2" />
        <text x="30" y="35" class="font-sans" font-size="14" text-anchor="middle" fill="#39ff14">🧹</text>
        <text x="58" y="25" class="font-sans" font-size="14" font-weight="700" fill="#f0f4fc">Automated Data Cleaning &amp; EDA</text>
        <text x="58" y="44" class="font-sans" font-size="12" fill="#94a3b8">Outlier Treatment, Feature Encoding, Analytics</text>
      </g>

      <!-- Capability 4 -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="370" height="60" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="30" r="16" fill="#ff9900" fill-opacity="0.2" />
        <text x="30" y="35" class="font-sans" font-size="14" text-anchor="middle" fill="#ff9900">🧠</text>
        <text x="58" y="25" class="font-sans" font-size="14" font-weight="700" fill="#f0f4fc">Deep Learning &amp; Generative AI</text>
        <text x="58" y="44" class="font-sans" font-size="12" fill="#94a3b8">TensorFlow, Neural Nets, RAG &amp; LLMs</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="435" y1="40" x2="435" y2="340" stroke="#334155" stroke-dasharray="4 4" />

  <!-- RIGHT COLUMN: 3-Slide Carousel -->
  <g transform="translate(460, 35)">
    <text class="font-mono" font-size="12" font-weight="bold" fill="#ff354f" letter-spacing="1.5">🚀 INTERESTS &amp; EXPLORATIONS</text>
    
    <!-- 3 Segment Progress Bars Header -->
    <g transform="translate(0, 25)">
      <rect x="0" y="0" width="110" height="6" rx="3" fill="#1e293b" />
      <rect class="p-bar-1" x="0" y="0" width="0" height="6" rx="3" fill="url(#progressGrad)" />

      <rect x="120" y="0" width="110" height="6" rx="3" fill="#1e293b" />
      <rect class="p-bar-2" x="120" y="0" width="0" height="6" rx="3" fill="url(#progressGrad)" />

      <rect x="240" y="0" width="110" height="6" rx="3" fill="#1e293b" />
      <rect class="p-bar-3" x="240" y="0" width="0" height="6" rx="3" fill="url(#progressGrad)" />
    </g>

    <!-- Carousel Content Box -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="355" height="240" rx="14" fill="#0d1527" stroke="#247bff" stroke-opacity="0.3" />

      <!-- SLIDE 1 -->
      <g class="slide-1" transform="translate(25, 25)">
        <text class="font-sans" font-size="28">🧠</text>
        <text class="font-sans" font-size="18" font-weight="800" fill="#00f0ff" x="0" y="60">Deep Learning &amp; GenAI</text>
        <text class="font-sans" font-size="13" fill="#cbd5e1" x="0" y="90">
          Exploring Neural Network Architectures, Convolutional Neural Networks (CNNs), and Transformer Models.
        </text>
        <text class="font-sans" font-size="13" fill="#94a3b8" x="0" y="140">
          • Text Embeddings &amp; LLM Finetuning<br/>
          • Retrieval-Augmented Generation (RAG)<br/>
          • Diffusion &amp; Generative AI Pipelines
        </text>
      </g>

      <!-- SLIDE 2 -->
      <g class="slide-2" transform="translate(25, 25)">
        <text class="font-sans" font-size="28">📊</text>
        <text class="font-sans" font-size="18" font-weight="800" fill="#ff007f" x="0" y="60">Business Intelligence &amp; Analytics</text>
        <text class="font-sans" font-size="13" fill="#cbd5e1" x="0" y="90">
          Architecting automated data reporting pipelines and real-time executive decision portals.
        </text>
        <text class="font-sans" font-size="13" fill="#94a3b8" x="0" y="140">
          • Microsoft Power BI &amp; SQL Queries<br/>
          • Retail Churn AI &amp; ROI Simulators<br/>
          • Multi-page Interactive Streamlit Apps
        </text>
      </g>

      <!-- SLIDE 3 -->
      <g class="slide-3" transform="translate(25, 25)">
        <text class="font-sans" font-size="28">⚡</text>
        <text class="font-sans" font-size="18" font-weight="800" fill="#39ff14" x="0" y="60">Algorithmic Problem Solving</text>
        <text class="font-sans" font-size="13" fill="#cbd5e1" x="0" y="90">
          Continuous algorithmic practice on competitive programming platforms and open-source contributions.
        </text>
        <text class="font-sans" font-size="13" fill="#94a3b8" x="0" y="140">
          • LeetCode, CodeChef, &amp; GeeksforGeeks<br/>
          • 40+ Contributions across GitHub Repos<br/>
          • Data Structures &amp; Optimization
        </text>
      </g>
    </g>
  </g>
</svg>