<svg width="100%" height="auto" viewBox="0 0 850 380" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'Courier New', Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Fixed Segmented Progress Bar Animations (width: 0px to 114px to prevent overlapping adjacent segments) */
    @keyframes bar1 { 0% { width: 0px; } 33% { width: 114px; } 100% { width: 114px; } }
    @keyframes bar2 { 0%, 33% { width: 0px; } 66% { width: 114px; } 100% { width: 114px; } }
    @keyframes bar3 { 0%, 66% { width: 0px; } 100% { width: 114px; } }

    .p-bar-1 { animation: bar1 12s infinite linear; }
    .p-bar-2 { animation: bar2 12s infinite linear; }
    .p-bar-3 { animation: bar3 12s infinite linear; }

    @keyframes slide1 { 0%, 31% { opacity: 1; transform: translateX(0); } 34%, 97% { opacity: 0; transform: translateX(20px); } }
    @keyframes slide2 { 0%, 31% { opacity: 0; transform: translateX(-20px); } 34%, 64% { opacity: 1; transform: translateX(0); } 67%, 100% { opacity: 0; transform: translateX(20px); } }
    @keyframes slide3 { 0%, 64% { opacity: 0; transform: translateX(-20px); } 67%, 97% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }

    .slide-1 { animation: slide1 12s infinite; }
    .slide-2 { animation: slide2 12s infinite; }
    .slide-3 { animation: slide3 12s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="376" rx="16" fill="url(#bgGrad)" stroke="url(#cardBorder)" stroke-width="2" />

  <!-- LEFT COLUMN: Core Capabilities -->
  <g transform="translate(35, 30)">
    <text class="font-mono" font-size="11" font-weight="bold" fill="#00f0ff" letter-spacing="1.5" x="0" y="14">⚡ CORE CAPABILITIES &amp; SPECIALIZATIONS</text>
    <text class="font-sans" font-size="20" font-weight="800" fill="#ffffff" x="0" y="40">Engineering Data &amp; AI Systems</text>

    <g transform="translate(0, 55)">
      <!-- Capability 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="370" height="62" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="31" r="16" fill="#247bff" fill-opacity="0.2" />
        <text x="30" y="36" class="font-sans" font-size="14" text-anchor="middle" fill="#00f0ff">🤖</text>
        <text x="58" y="26" class="font-sans" font-size="13" font-weight="700" fill="#f0f4fc">End-to-End Predictive ML Pipelines</text>
        <text x="58" y="44" class="font-sans" font-size="11" fill="#94a3b8">Regression, Churn Risk AI, Sales Forecasting</text>
      </g>

      <!-- Capability 2 -->
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="370" height="62" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="31" r="16" fill="#ff007f" fill-opacity="0.2" />
        <text x="30" y="36" class="font-sans" font-size="14" text-anchor="middle" fill="#ff007f">📊</text>
        <text x="58" y="26" class="font-sans" font-size="13" font-weight="700" fill="#f0f4fc">Interactive BI &amp; Decision Dashboards</text>
        <text x="58" y="44" class="font-sans" font-size="11" fill="#94a3b8">Streamlit Cloud, Power BI Desktop, Plotly</text>
      </g>

      <!-- Capability 3 -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="370" height="62" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="31" r="16" fill="#39ff14" fill-opacity="0.2" />
        <text x="30" y="36" class="font-sans" font-size="14" text-anchor="middle" fill="#39ff14">🧹</text>
        <text x="58" y="26" class="font-sans" font-size="13" font-weight="700" fill="#f0f4fc">Automated Data Cleaning &amp; EDA</text>
        <text x="58" y="44" class="font-sans" font-size="11" fill="#94a3b8">Outlier Treatment, Feature Encoding, Analytics</text>
      </g>

      <!-- Capability 4 -->
      <g transform="translate(0, 210)">
        <rect x="0" y="0" width="370" height="62" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#334155" />
        <circle cx="30" cy="31" r="16" fill="#ff9900" fill-opacity="0.2" />
        <text x="30" y="36" class="font-sans" font-size="14" text-anchor="middle" fill="#ff9900">🧠</text>
        <text x="58" y="26" class="font-sans" font-size="13" font-weight="700" fill="#f0f4fc">Deep Learning &amp; Generative AI</text>
        <text x="58" y="44" class="font-sans" font-size="11" fill="#94a3b8">TensorFlow, Neural Nets, RAG &amp; LLMs</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="425" y1="35" x2="425" y2="345" stroke="#334155" stroke-dasharray="4 4" />

  <!-- RIGHT COLUMN: 3-Slide Carousel -->
  <g transform="translate(445, 30)">
    <text class="font-mono" font-size="11" font-weight="bold" fill="#ff354f" letter-spacing="1.5" x="0" y="14">🚀 INTERESTS &amp; EXPLORATIONS</text>
    
    <!-- 3 Segment Progress Bars Header (Strict 114px Segment Bounds) -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="114" height="6" rx="3" fill="#1e293b" />
      <rect class="p-bar-1" x="0" y="0" width="0" height="6" rx="3" fill="url(#progressGrad)" />

      <rect x="126" y="0" width="114" height="6" rx="3" fill="#1e293b" />
      <rect class="p-bar-2" x="126" y="0" width="0" height="6" rx="3" fill="url(#progressGrad)" />

      <rect x="252" y="0" width="114" height="6" rx="3" fill="#1e293b" />
      <rect class="p-bar-3" x="252" y="0" width="0" height="6" rx="3" fill="url(#progressGrad)" />
    </g>

    <!-- Carousel Content Box -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="370" height="265" rx="14" fill="#0d1527" stroke="#247bff" stroke-opacity="0.3" />

      <!-- SLIDE 1 -->
      <g class="slide-1" transform="translate(0, 0)">
        <text class="font-sans" font-size="24" x="28" y="38">🧠</text>
        <text class="font-sans" font-size="16" font-weight="800" fill="#00f0ff" x="28" y="66">Deep Learning &amp; GenAI</text>
        
        <text class="font-sans" font-size="12" fill="#cbd5e1" x="28" y="94">
          <tspan x="28" dy="0">Exploring Neural Network Architectures, CNNs,</tspan>
          <tspan x="28" dy="18">and Transformer Models for Computer Vision.</tspan>
        </text>

        <text class="font-sans" font-size="12" fill="#94a3b8" x="28" y="148">
          <tspan x="28" dy="0">• Text Embeddings &amp; LLM Finetuning</tspan>
          <tspan x="28" dy="20">• Retrieval-Augmented Generation (RAG)</tspan>
          <tspan x="28" dy="20">• Diffusion &amp; Generative AI Pipelines</tspan>
        </text>
      </g>

      <!-- SLIDE 2 -->
      <g class="slide-2" transform="translate(0, 0)">
        <text class="font-sans" font-size="24" x="28" y="38">📊</text>
        <text class="font-sans" font-size="15" font-weight="800" fill="#ff007f" x="28" y="66">Business Intelligence &amp; Analytics</text>
        
        <text class="font-sans" font-size="12" fill="#cbd5e1" x="28" y="94">
          <tspan x="28" dy="0">Architecting automated data reporting pipelines and</tspan>
          <tspan x="28" dy="18">real-time executive decision portals.</tspan>
        </text>

        <text class="font-sans" font-size="12" fill="#94a3b8" x="28" y="148">
          <tspan x="28" dy="0">• Microsoft Power BI &amp; Complex SQL Queries</tspan>
          <tspan x="28" dy="20">• Retail Churn AI &amp; ROI Simulators</tspan>
          <tspan x="28" dy="20">• Multi-page Interactive Streamlit Apps</tspan>
        </text>
      </g>

      <!-- SLIDE 3 -->
      <g class="slide-3" transform="translate(0, 0)">
        <text class="font-sans" font-size="24" x="28" y="38">⚡</text>
        <text class="font-sans" font-size="15" font-weight="800" fill="#39ff14" x="28" y="66">Algorithmic Problem Solving</text>
        
        <text class="font-sans" font-size="12" fill="#cbd5e1" x="28" y="94">
          <tspan x="28" dy="0">Continuous algorithmic practice on competitive</tspan>
          <tspan x="28" dy="18">platforms and open-source contributions.</tspan>
        </text>

        <text class="font-sans" font-size="12" fill="#94a3b8" x="28" y="148">
          <tspan x="28" dy="0">• LeetCode, CodeChef, &amp; GeeksforGeeks</tspan>
          <tspan x="28" dy="20">• 40+ Contributions across GitHub Repos</tspan>
          <tspan x="28" dy="20">• Data Structures &amp; Optimization</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>