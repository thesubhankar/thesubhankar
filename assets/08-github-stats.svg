<svg width="100%" height="auto" viewBox="0 0 850 250" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#247bff"/><stop offset="100%" stop-color="#00f0ff"/></linearGradient>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#070b16"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>
  <style>
    .font-mono { font-family: 'Courier New', Courier, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  
  <rect x="2" y="2" width="846" height="246" rx="16" fill="url(#gBg)" stroke="url(#gB)" stroke-width="2"/>
  
  <!-- HEADER -->
  <g transform="translate(35, 22)">
    <text class="font-mono" font-size="12" font-weight="bold" fill="#00f0ff" letter-spacing="1.5" x="0" y="14">📊 GITHUB STATISTICS &amp; OVERVIEW</text>
    
    <!-- 2 SUB-CARDS CONTAINER -->
    <g transform="translate(0, 26)">
      
      <!-- LEFT CARD: STATS -->
      <g transform="translate(0, 0)">
        <rect width="380" height="175" rx="12" fill="#0d1527" stroke="#247bff" stroke-width="1.5"/>
        <text x="20" y="32" class="font-sans" font-size="18" font-weight="800" fill="#00f0ff">Stats</text>

        <!-- Stats Items -->
        <g transform="translate(20, 42)">
          <!-- Item 1: Total Stars -->
          <g transform="translate(0, 14)">
            <text x="0" y="0" class="font-sans" font-size="12">⭐</text>
            <text x="22" y="0" class="font-sans" font-size="12" fill="#38bdf8">Total Stars:</text>
            <text x="135" y="0" class="font-sans" font-size="12" font-weight="bold" fill="#38bdf8">7</text>
          </g>

          <!-- Item 2: Total Commits -->
          <g transform="translate(0, 36)">
            <text x="0" y="0" class="font-sans" font-size="12">🔀</text>
            <text x="22" y="0" class="font-sans" font-size="12" fill="#38bdf8">Total Commits:</text>
            <text x="135" y="0" class="font-sans" font-size="12" font-weight="bold" fill="#38bdf8">83</text>
          </g>

          <!-- Item 3: Total PRs -->
          <g transform="translate(0, 58)">
            <text x="0" y="0" class="font-sans" font-size="12">🔀</text>
            <text x="22" y="0" class="font-sans" font-size="12" fill="#38bdf8">Total PRs:</text>
            <text x="135" y="0" class="font-sans" font-size="12" font-weight="bold" fill="#38bdf8">0</text>
          </g>

          <!-- Item 4: Total Issues -->
          <g transform="translate(0, 80)">
            <text x="0" y="0" class="font-sans" font-size="12">❗</text>
            <text x="22" y="0" class="font-sans" font-size="12" fill="#38bdf8">Total Issues:</text>
            <text x="135" y="0" class="font-sans" font-size="12" font-weight="bold" fill="#38bdf8">0</text>
          </g>

          <!-- Item 5: Contributed to -->
          <g transform="translate(0, 102)">
            <text x="0" y="0" class="font-sans" font-size="12">📑</text>
            <text x="22" y="0" class="font-sans" font-size="12" fill="#38bdf8">Contributed to:</text>
            <text x="135" y="0" class="font-sans" font-size="12" font-weight="bold" fill="#38bdf8">8</text>
          </g>
        </g>

        <!-- Right Side: Purple Octocat Circle -->
        <g transform="translate(290, 88)">
          <circle cx="0" cy="0" r="45" fill="#a855f7"/>
          <path d="M -18 -8 C -18 -18 -8 -25 0 -25 C 8 -25 18 -18 18 -8 C 18 8 12 18 0 25 C -12 18 -18 8 -18 -8 Z" fill="#0d1527"/>
          <!-- Cat ears -->
          <path d="M -14 -16 L -20 -28 L -6 -22 Z" fill="#0d1527"/>
          <path d="M 14 -16 L 20 -28 L 6 -22 Z" fill="#0d1527"/>
          <!-- Cat tail curve -->
          <path d="M -16 12 C -28 18 -26 30 -16 28 C -10 26 -16 20 -12 16 Z" fill="#0d1527"/>
        </g>
      </g>

      <!-- RIGHT CARD: TOP LANGUAGES BY REPO -->
      <g transform="translate(395, 0)">
        <rect width="385" height="175" rx="12" fill="#0d1527" stroke="#ff007f" stroke-width="1.5"/>
        <text x="20" y="32" class="font-sans" font-size="18" font-weight="800" fill="#00f0ff">Top Languages by Repo</text>

        <!-- Legend List -->
        <g transform="translate(20, 52)">
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="14" height="14" rx="3" fill="#3776AB"/>
            <text x="22" y="12" class="font-sans" font-size="12" fill="#cbd5e1" font-weight="600">Python</text>
          </g>
          <g transform="translate(0, 26)">
            <rect x="0" y="0" width="14" height="14" rx="3" fill="#F37626"/>
            <text x="22" y="12" class="font-sans" font-size="12" fill="#cbd5e1" font-weight="600">Jupyter Notebook</text>
          </g>
          <g transform="translate(0, 52)">
            <rect x="0" y="0" width="14" height="14" rx="3" fill="#E34F26"/>
            <text x="22" y="12" class="font-sans" font-size="12" fill="#cbd5e1" font-weight="600">HTML / CSS</text>
          </g>
          <g transform="translate(0, 78)">
            <rect x="0" y="0" width="14" height="14" rx="3" fill="#00758F"/>
            <text x="22" y="12" class="font-sans" font-size="12" fill="#cbd5e1" font-weight="600">SQL</text>
          </g>
        </g>

        <!-- DONUT CHART (RIGHT SIDE) -->
        <g transform="translate(285, 95)">
          <!-- Segment 1: Python (45%) -->
          <path d="M 0 -50 A 50 50 0 0 1 47.5 15.4 L 28.5 9.2 A 30 30 0 0 0 0 -30 Z" fill="#3776AB"/>
          <!-- Segment 2: Jupyter (30%) -->
          <path d="M 47.5 15.4 A 50 50 0 0 1 -29.4 40.5 L -17.6 24.3 A 30 30 0 0 0 28.5 9.2 Z" fill="#F37626"/>
          <!-- Segment 3: HTML/CSS (15%) -->
          <path d="M -29.4 40.5 A 50 50 0 0 1 -48.7 -11.3 L -29.2 -6.8 A 30 30 0 0 0 -17.6 24.3 Z" fill="#E34F26"/>
          <!-- Segment 4: SQL (10%) -->
          <path d="M -48.7 -11.3 A 50 50 0 0 1 0 -50 L 0 -30 A 30 30 0 0 0 -29.2 -6.8 Z" fill="#00758F"/>
          
          <!-- Inner Hole -->
          <circle cx="0" cy="0" r="28" fill="#0d1527"/>
        </g>
      </g>
    </g>
  </g>
</svg>