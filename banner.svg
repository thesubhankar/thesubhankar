<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%" style="border-radius: 12px; overflow: hidden; background: #030712;">
  <defs>
    <!-- Font Import -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=Fira+Code:wght@500&amp;display=swap');
      
      .main-title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 58px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.02em;
      }
      
      .subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 600;
        fill: #cbd5e1;
        letter-spacing: 0.05em;
      }

      .tech-line {
        stroke: #06b6d4;
        stroke-width: 1.5;
        stroke-dasharray: 8 6;
        opacity: 0.6;
        animation: dash 20s linear infinite;
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }

      .pulse-node {
        animation: pulse 3s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); }
      }

      .star {
        animation: twinkle 4s infinite ease-in-out;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.9; }
      }
    </style>

    <!-- Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0b0f19" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="beam-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beam-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="city-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" fill="url(#bg-grad)" />

  <!-- Perspective Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="430" x2="1200" y2="430" />

    <!-- Vanishing Lines from Center Horizon (600, 225) -->
    <line x1="600" y1="225" x2="-200" y2="450" />
    <line x1="600" y1="225" x2="0" y2="450" />
    <line x1="600" y1="225" x2="200" y2="450" />
    <line x1="600" y1="225" x2="400" y2="450" />
    <line x1="600" y1="225" x2="600" y2="450" />
    <line x1="600" y1="225" x2="800" y2="450" />
    <line x1="600" y1="225" x2="1000" y2="450" />
    <line x1="600" y1="225" x2="1200" y2="450" />
    <line x1="600" y1="225" x2="1400" y2="450" />

    <!-- Top Ceiling Grid -->
    <line x1="600" y1="225" x2="-200" y2="0" />
    <line x1="600" y1="225" x2="200" y2="0" />
    <line x1="600" y1="225" x2="600" y2="0" />
    <line x1="600" y1="225" x2="1000" y2="0" />
    <line x1="600" y1="225" x2="1400" y2="0" />
  </g>

  <!-- Twinkling Stars -->
  <g fill="#ffffff">
    <circle class="star" cx="120" cy="60" r="1" opacity="0.6" />
    <circle class="star" cx="280" cy="90" r="1.5" opacity="0.8" />
    <circle class="star" cx="450" cy="40" r="1.2" opacity="0.5" />
    <circle class="star" cx="750" cy="70" r="1.5" opacity="0.7" />
    <circle class="star" cx="980" cy="50" r="1" opacity="0.9" />
    <circle class="star" cx="1100" cy="110" r="1.2" opacity="0.6" />
  </g>

  <!-- Cyberpunk City Skyline (Right Side Horizon) -->
  <g fill="url(#city-grad)" stroke="#312e81" stroke-width="0.5">
    <rect x="820" y="160" width="22" height="65" />
    <rect x="846" y="140" width="30" height="85" />
    <rect x="880" y="170" width="18" height="55" />
    <rect x="902" y="120" width="35" height="105" />
    <!-- Spire building -->
    <polygon points="950,110 953,80 956,110" />
    <rect x="942" y="110" width="20" height="115" />
    <rect x="966" y="150" width="28" height="75" />
    <rect x="998" y="130" width="32" height="95" />
    <rect x="1034" y="165" width="24" height="60" />
    <rect x="1062" y="145" width="40" height="80" />
  </g>

  <!-- Glowing Horizon Line -->
  <!-- Left Magenta Light Horizon -->
  <line x1="0" y1="225" x2="600" y2="225" stroke="#c084fc" stroke-width="3" filter="url(#purple-glow)" />
  <line x1="0" y1="225" x2="600" y2="225" stroke="#ffffff" stroke-width="1" />

  <!-- Right Cyan Light Horizon -->
  <line x1="600" y1="225" x2="1200" y2="225" stroke="#22d3ee" stroke-width="3" filter="url(#cyan-glow)" />
  <line x1="600" y1="225" x2="1200" y2="225" stroke="#ffffff" stroke-width="1" />

  <!-- Tech Circuit Node Lines (Left Side) -->
  <g stroke="#a855f7" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 80,120 L 220,120 L 280,170 L 350,170" />
    <circle cx="80" cy="120" r="3" fill="#a855f7" />
    <circle cx="220" cy="120" r="2.5" fill="#c084fc" />
    <circle cx="350" cy="170" r="3" fill="#a855f7" />

    <path d="M 120,320 L 250,320 L 300,270 L 380,270" />
    <circle cx="120" cy="320" r="3" fill="#a855f7" />
    <circle cx="380" cy="270" r="2.5" fill="#c084fc" />
  </g>

  <!-- Tech Circuit Node Lines (Right Side) -->
  <g stroke="#06b6d4" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 1120,130 L 980,130 L 920,170 L 850,170" />
    <circle cx="1120" cy="130" r="3" fill="#06b6d4" />
    <circle cx="980" cy="130" r="2.5" fill="#22d3ee" />
    <circle cx="850" cy="170" r="3" fill="#06b6d4" />

    <path d="M 1080,310 L 950,310 L 900,270 L 820,270" />
    <circle cx="1080" cy="310" r="3" fill="#06b6d4" />
    <circle cx="820" cy="270" r="2.5" fill="#22d3ee" />
  </g>

  <!-- Center Framing Box (Futuristic Sci-Fi HUD Container) -->
  <g>
    <!-- Background Glass Tint -->
    <rect x="300" y="145" width="600" height="155" rx="16" fill="#090d16" fill-opacity="0.75" stroke="url(#frame-grad)" stroke-width="2" filter="url(#cyan-glow)" />

    <!-- Corner Accents -->
    <!-- Top Left -->
    <path d="M 290,165 L 290,135 L 320,135" stroke="#a855f7" stroke-width="3" fill="none" />
    <!-- Top Right -->
    <path d="M 910,165 L 910,135 L 880,135" stroke="#06b6d4" stroke-width="3" fill="none" />
    <!-- Bottom Left -->
    <path d="M 290,280 L 290,310 L 320,310" stroke="#a855f7" stroke-width="3" fill="none" />
    <!-- Bottom Right -->
    <path d="M 910,280 L 910,310 L 880,310" stroke="#06b6d4" stroke-width="3" fill="none" />
  </g>

  <!-- Center Text Content -->
  <!-- Glow Layer -->
  <text x="600" y="210" text-anchor="middle" class="main-title" filter="url(#cyan-glow)" opacity="0.6">Subhankar Giri</text>
  <!-- Sharp Layer -->
  <text x="600" y="210" text-anchor="middle" class="main-title">Subhankar Giri</text>

  <!-- Subtitle -->
  <text x="600" y="260" text-anchor="middle" class="subtitle">Data Science &amp; AI/ML Engineer</text>
</svg>
