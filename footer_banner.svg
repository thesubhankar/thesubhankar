<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" style="border-radius: 12px; overflow: hidden; background: #030712;">
  <defs>
    <!-- Font Import -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&amp;family=Fira+Code:wght@500;700&amp;display=swap');
      
      .main-title {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.01em;
      }
      
      .subtitle {
        font-family: 'Fira Code', monospace;
        font-size: 16px;
        font-weight: 600;
        fill: #06b6d4;
        letter-spacing: 0.03em;
      }

      .code-watermark {
        font-family: 'Fira Code', monospace;
        font-weight: 500;
      }

      .star {
        animation: twinkle 3.5s infinite ease-in-out;
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.85; }
      }

      .neural-synapse {
        animation: synapse 4s infinite ease-in-out;
      }
      @keyframes synapse {
        0%, 100% { opacity: 0.35; stroke-dashoffset: 20; }
        50% { opacity: 0.85; stroke-dashoffset: 0; }
      }
    </style>

    <!-- Glow Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#0b0f19" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" fill="url(#bg-grad)" />

  <!-- Perspective Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="210" x2="1200" y2="210" />

    <line x1="600" y1="120" x2="-200" y2="240" />
    <line x1="600" y1="120" x2="0" y2="240" />
    <line x1="600" y1="120" x2="200" y2="240" />
    <line x1="600" y1="120" x2="400" y2="240" />
    <line x1="600" y1="120" x2="600" y2="240" />
    <line x1="600" y1="120" x2="800" y2="240" />
    <line x1="600" y1="120" x2="1000" y2="240" />
    <line x1="600" y1="120" x2="1200" y2="240" />
    <line x1="600" y1="120" x2="1400" y2="240" />
  </g>

  <!-- Data Science & AI/ML Watermarks (Background Sky) -->
  <g class="code-watermark">
    <text x="70" y="45" font-size="12" fill="#a855f7" opacity="0.4">model.predict(X_test)</text>
    <text x="240" y="35" font-size="12" fill="#06b6d4" opacity="0.35">Accuracy: 99.8%</text>
    <text x="940" y="45" font-size="12" fill="#06b6d4" opacity="0.45">&lt;Connect &amp; Collaborate&gt;</text>
    <text x="980" y="195" font-size="12" fill="#38bdf8" opacity="0.4">Loss: 0.0012</text>
    <text x="60" y="200" font-size="12" fill="#c084fc" opacity="0.4">import tensorflow as tf</text>
  </g>

  <!-- Neural Network Nodes Graph (Left Background) -->
  <g stroke-width="1.2" opacity="0.6">
    <line x1="60" y1="80" x2="140" y2="60" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="80" x2="140" y2="110" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="140" x2="140" y2="110" stroke="#a855f7" class="neural-synapse" />
    <line x1="60" y1="140" x2="140" y2="160" stroke="#a855f7" class="neural-synapse" />

    <line x1="140" y1="60" x2="220" y2="90" stroke="#06b6d4" class="neural-synapse" />
    <line x1="140" y1="110" x2="220" y2="90" stroke="#06b6d4" class="neural-synapse" />
    <line x1="140" y1="160" x2="220" y2="140" stroke="#06b6d4" class="neural-synapse" />

    <circle cx="60" cy="80" r="4.5" fill="#a855f7" filter="url(#purple-glow)" />
    <circle cx="60" cy="140" r="4.5" fill="#a855f7" filter="url(#purple-glow)" />

    <circle cx="140" cy="60" r="5" fill="#c084fc" />
    <circle cx="140" cy="110" r="5" fill="#06b6d4" />
    <circle cx="140" cy="160" r="5" fill="#c084fc" />

    <circle cx="220" cy="90" r="6" fill="#00f0ff" filter="url(#cyan-glow)" />
    <circle cx="220" cy="140" r="6" fill="#00f0ff" filter="url(#cyan-glow)" />
  </g>

  <!-- ML Predictive Analytics Optimization Curve & Area Chart (Right Background) -->
  <g opacity="0.6">
    <path d="M 940,200 Q 1000,100 1060,150 T 1170,80 L 1170,200 Z" fill="url(#chart-grad)" />
    <path d="M 940,200 Q 1000,100 1060,150 T 1170,80" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#cyan-glow)" />
    
    <circle cx="1000" cy="125" r="3.5" fill="#ffffff" />
    <circle cx="1060" cy="150" r="3.5" fill="#00f0ff" />
    <circle cx="1115" cy="115" r="3.5" fill="#a855f7" />
    <circle cx="1170" cy="80" r="4.5" fill="#ffffff" filter="url(#cyan-glow)" />
  </g>

  <!-- Data Analytics Column Bar Chart (Bottom Right) -->
  <g opacity="0.45" fill="#06b6d4">
    <rect x="860" y="160" width="10" height="40" rx="2" />
    <rect x="876" y="145" width="10" height="55" rx="2" fill="#38bdf8" />
    <rect x="892" y="130" width="10" height="70" rx="2" fill="#818cf8" />
    <rect x="908" y="110" width="10" height="90" rx="2" fill="#a855f7" filter="url(#purple-glow)" />
  </g>

  <!-- Twinkling Stars -->
  <g fill="#ffffff">
    <circle class="star" cx="120" cy="35" r="1" opacity="0.6" />
    <circle class="star" cx="300" cy="45" r="1.2" opacity="0.8" />
    <circle class="star" cx="540" cy="25" r="1" opacity="0.5" />
    <circle class="star" cx="780" cy="35" r="1.2" opacity="0.7" />
    <circle class="star" cx="990" cy="25" r="1" opacity="0.9" />
    <circle class="star" cx="1120" cy="55" r="1.2" opacity="0.6" />
  </g>

  <!-- Glowing Horizon Line -->
  <line x1="0" y1="120" x2="600" y2="120" stroke="#c084fc" stroke-width="2.5" filter="url(#purple-glow)" />
  <line x1="0" y1="120" x2="600" y2="120" stroke="#ffffff" stroke-width="0.8" />

  <line x1="600" y1="120" x2="1200" y2="120" stroke="#22d3ee" stroke-width="2.5" filter="url(#cyan-glow)" />
  <line x1="600" y1="120" x2="1200" y2="120" stroke="#ffffff" stroke-width="0.8" />

  <!-- Center Framing Box (Futuristic Sci-Fi HUD Container) -->
  <g>
    <!-- Background Glass Tint -->
    <rect x="320" y="65" width="560" height="110" rx="14" fill="#090d16" fill-opacity="0.82" stroke="url(#frame-grad)" stroke-width="2" filter="url(#cyan-glow)" />

    <!-- Corner Accents -->
    <path d="M 310,80 L 310,55 L 335,55" stroke="#a855f7" stroke-width="2.5" fill="none" />
    <path d="M 890,80 L 890,55 L 865,55" stroke="#06b6d4" stroke-width="2.5" fill="none" />
    <path d="M 310,160 L 310,185 L 335,185" stroke="#a855f7" stroke-width="2.5" fill="none" />
    <path d="M 890,160 L 890,185 L 865,185" stroke="#06b6d4" stroke-width="2.5" fill="none" />
  </g>

  <!-- Center Text Content -->
  <text x="600" y="112" text-anchor="middle" class="main-title" filter="url(#cyan-glow)" opacity="0.6">Thanks for Visiting!</text>
  <text x="600" y="112" text-anchor="middle" class="main-title">Thanks for Visiting!</text>

  <!-- Subtitle -->
  <text x="600" y="148" text-anchor="middle" class="subtitle">⚡ Let's Connect &amp; Collaborate | Data Science &amp; AI/ML ⚡</text>
</svg>
