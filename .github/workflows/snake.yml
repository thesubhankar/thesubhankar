name: Generate Snake Contribution Grid

on:
  schedule:
    # run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00f0ff&color_dots=#161b22,#003b57,#0077b5,#00f0ff,#9d4edd
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff007f&color_dots=#0d1117,#161b22,#00f0ff,#9d4edd,#ff007f
            dist/github-contribution-grid-snake-3d.svg?palette=github-dark&color_snake=#00f0ff

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
